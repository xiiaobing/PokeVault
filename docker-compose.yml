services:
  
  backend:
    build:
      context: ./backend
    container_name: tcg-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: host.docker.internal
      PYTHONUTF8: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
    command: >
      sh -c "
        python manage.py update_exchange_rate;
        python manage.py update_portfolio_snapshots || echo 'WARNING: Portfolio snapshot creation failed.';
        python manage.py runserver 0.0.0.0:8000
      "

  frontend:
    build:
      context: ./frontend
    container_name: tcg-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_PROXY_TARGET=http://backend:8000
    depends_on:
      - backend
